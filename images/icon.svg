    <path
      fill="url(#ado-gradient)"
      d="M 476.00 141.78
         V 363.84
         L 366.00 438.63
         L 195.50 387.09
         V 438.17
         L 98.98 333.52
         L 380.30 351.76
         V 151.81
         Z
         M 382.23 152.95
         L 224.37 73.37
         V 125.59
         L 79.45 160.92
         L 36.00 207.21
         V 312.32
         L 98.15 335.12
         V 200.37
         Z"
    />
  </g>

  <!-- CLI Terminal Prompt (>_) -->
  <g id="terminal-prompt" fill="#0f172a">
    <!-- Chevron (>) -->
    <path d="M 146.97 305.86
             L 211.37 257.03
             L 146.97 208.20
             L 168.19 192.11
             L 253.80 257.03
             L 168.19 321.95
             Z" />
    <!-- Underscore Cursor (_) -->
    <rect x="240" y="314" width="120" height="23" rx="3" ry="3" />
  </g>
</svg>
